<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Tangzy Blog · 写下来的事</title><meta name="description" content="Tangzy 的个人博客：技术、科研笔记与生活随笔，按时间与类别整理。"><link rel="canonical" href="https://tangzy0121.github.io/Tangzy0121/blog/"><link rel="stylesheet" href="style.css"><script src="posts.js" defer></script><script src="app.js" defer></script></head><body>
<div id="tangzy-blog" aria-label="Tangzy 博客">
  <div class="bs-page" aria-label="博客目录">
    <header class="bs-top"><a class="bs-brand" href="../">Tangzy<span class="bs-heart" aria-hidden="true">♡</span></a><span class="bs-location">/ Blog</span><a class="bs-home" href="../">返回主页</a></header>
    <main>
      <section class="bs-archive" aria-label="文章目录">
        <div class="bs-heading"><h1>写下来的事。</h1><span class="bs-caption">文章目录</span></div>
        <form class="bs-toolbar" role="search" aria-label="搜索与筛选文章">
          <div class="bs-search-field">
            <label for="bs-query">搜索文章</label>
            <div class="bs-search-box">
              <input id="bs-query" type="search" maxlength="160" autocomplete="off" placeholder="标题、标签或正文关键词">
              <button class="bs-clear cursor-interaction" type="button" aria-label="清空搜索" hidden>清空</button>
            </div>
          </div>
          <div class="bs-year-field"><label for="bs-year">年份</label><select id="bs-year" class="cursor-interaction"><option value="all">全部年份</option></select></div>
        </form>
        <nav class="bs-categories" aria-label="文章类别"></nav>
        <div class="bs-result-bar"><span class="bs-count" role="status" aria-live="polite" aria-atomic="true"></span><button type="button" class="bs-reset cursor-interaction" hidden>重置筛选</button></div>
        <div class="bs-results"></div>
        <div class="bs-empty" hidden><h2>没有找到相关文章</h2><p>试试其他关键词，或放宽类别与年份。</p><button type="button" class="bs-empty-reset cursor-interaction">查看全部文章</button></div>
        <button type="button" class="bs-more cursor-interaction" hidden></button>
      </section>
      <article class="bs-reader" aria-label="文章阅读" hidden>
        <button type="button" class="bs-back cursor-interaction">← 返回目录</button>
        <h1 class="bs-reader-title"></h1>
        <div class="bs-reader-meta"></div>
        <div class="bs-reader-tags"></div>
        <div class="bs-reader-body"></div>
      </article>
    </main>
    <footer class="bs-footer"><span>文字慢慢积累。</span><span>Tangzy · Blog</span></footer>
  </div>
</div>
<noscript>请启用 JavaScript 浏览文章目录，或<a href="../">返回个人主页</a>。</noscript>
</body></html>
